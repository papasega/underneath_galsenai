# LoRA SFT hyper-parameters for Gemma 4 E2B (mlx-lm). Edit here, then run ./scripts/train_lora.sh
# `epochs` is read by train_lora.sh, which turns it into --iters = ceil(epochs * n_train / batch_size)
# and evaluates/saves once per epoch. mlx-lm itself only knows `iters`.
epochs: 5

model: mlx-community/gemma-4-E2B-it-qat-4bit
train: true
data: data/private/mlx_sft
adapter_path: data/private/adapters/gemma4_e2b_galsenai
fine_tune_type: lora        # lora | dora | full
mask_prompt: true           # loss on assistant tokens only
seed: 0

batch_size: 4
learning_rate: 1.0e-4
max_seq_length: 1024        # longest conversation is about 620 tokens
num_layers: -1              # -1 = LoRA on all layers
grad_checkpoint: true       # keep true: without it rank 64 / batch 8 runs out of Metal memory on 24 GB

lora_parameters:
  rank: 32                  # tested up to 128 with batch 8 and grad_checkpoint without error
  scale: 20.0
  dropout: 0.05
