# nanochat-style pipeline on galsenai: tokenizer -> base (next-token on chat text) -> SFT (assistant tokens only).
#   python3 scripts/train_tokenizer.py --config config_nanochat.yml
#   python -m galsenai.train --config config_nanochat.yml --stage base
#   python -m galsenai.train --config config_nanochat.yml --stage sft
# Epochs are explicit: steps = epochs * ceil(n_examples / batch_size) (base: one epoch = one pass over the tokens).
tokenizer:
  corpus: data/private/chat_anonymized.txt     # from scripts/anonymize_chat.py
  sft_train: data/private/mlx_sft/train.jsonl  # same split as the Gemma LoRA run
  vocab_size: 2048                             # BPE merges; the 5 chat specials are added on top
  out_prefix: data/private/galsenai_tok/galsenai

model:                                          # passed to ModelConfig.nanochat(); about 12M parameters
  n_layer: 6
  n_head: 6
  n_embd: 384
  block_size: 1024
  sliding_window: 256
  dropout: 0.0

base:
  corpus: data/private/chat_anonymized.txt
  seq_len: 256
  epochs: 30
  batch_size: 32
  learning_rate: 1.0e-3
  warmup_steps: 20
  val_fraction: 0.05
  out: data/private/checkpoints/galsenai_base.pt

sft:
  train: data/private/mlx_sft/train.jsonl
  valid: data/private/mlx_sft/valid.jsonl
  init_from: data/private/checkpoints/galsenai_base.pt   # null = SFT from scratch (no leakage from the raw chat)
  epochs: 10
  batch_size: 4
  learning_rate: 3.0e-4
  warmup_steps: 5
  out: data/private/checkpoints/galsenai_sft.pt

seed: 0
