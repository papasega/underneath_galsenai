[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "galsenai"
version = "0.1.0"
description = "A small, modern decoder-only transformer built for on-device use."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "torch>=2.5",
    "numpy>=1.26",  # tensor interoperability and dense retrieval
    "regex>=2023.0",  # used by the vendored minbpe tokenizer
    "tqdm>=4.66",  # progress bars in minbpe training
    "tiktoken>=0.7",  # imported by minbpe/__init__.py (GPT4Tokenizer)
    "pyyaml>=6",  # training config files (config/pilotv1_config/config_nanochat.yml)
]

[project.optional-dependencies]
mlx = [
    "mlx-lm==0.32.2; sys_platform == 'darwin' and platform_machine == 'arm64' and python_version >= '3.11'",
    "mlx==0.32.4; sys_platform == 'darwin' and platform_machine == 'arm64' and python_version >= '3.11'",
    "transformers==5.24.0; sys_platform == 'darwin' and platform_machine == 'arm64' and python_version >= '3.11'",
]
hf-train = [
    "transformers>=5.18,<6; python_version >= '3.11'",
    "peft>=0.22,<1; python_version >= '3.11'",
    "accelerate>=1.1,<2; python_version >= '3.11'",
]
rag = ["sentence-transformers>=6.1", "transformers>=5.18"]  # embeddinggemma-2 retrieval (webapp/rag.py)
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10"]

[tool.setuptools]
package-dir = { "" = "src", "minbpe" = "minbpe" }
packages = ["galsenai", "minbpe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["minbpe", "legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/galsenai"]
ignore_missing_imports = true
warn_return_any = false  # torch modules return Any from __call__

[[tool.mypy.overrides]]
module = "minbpe.*"  # vendored third-party code, untyped
follow_imports = "skip"

# The locked Linux environment uses CPU Torch for CI. CUDA users install a matching
# PyTorch wheel with pip, then the hf-train extra (see README).
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
