[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "galsenai"
version = "0.1.0"
description = "A small, modern decoder-only transformer built for on-device use."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.5",
    "regex>=2023.0",  # used by the vendored minbpe tokenizer
    "tqdm>=4.66",  # progress bars in minbpe training
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10"]

[tool.setuptools]
package-dir = { "" = "src", "minbpe" = "minbpe" }
packages = ["galsenai", "minbpe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["minbpe", "legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/galsenai"]
ignore_missing_imports = true
warn_return_any = false  # torch modules return Any from __call__

[[tool.mypy.overrides]]
module = "minbpe.*"  # vendored third-party code, untyped
follow_imports = "skip"
