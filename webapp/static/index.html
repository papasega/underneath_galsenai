<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GalsenAI Chat</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <img src="/logo.svg" alt="GalsenAI" class="logo">
    <span id="model" class="model"></span>
    <button id="clear" class="ghost" title="Nouvelle conversation">Nouveau</button>
  </header>
  <main id="log" aria-live="polite">
    <div id="empty" class="empty">
      <h1>Posez votre question</h1>
      <p>Assistant de la communauté GalsenAI.</p>
    </div>
  </main>
  <form id="form">
    <textarea id="input" rows="1" placeholder="Écrivez un message…" autofocus></textarea>
    <button id="send" type="submit" aria-label="Envoyer">&#10148;</button>
  </form>
  <script src="/app.js"></script>
</body>
</html>
